<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Move and strike timing: the carriage leaves as late as possible and the solenoid fires early by the latency</title>
  <rect width="900" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">One note: C5 → G5 on the beat</text>

  <!-- lane labels -->
  <text x="20" y="92" fill="#222" font-weight="bold">Carriage</text>
  <text x="20" y="110" fill="#666" font-size="12">position</text>
  <text x="20" y="182" fill="#222" font-weight="bold">Solenoid</text>
  <text x="20" y="252" fill="#222" font-weight="bold">Sound</text>

  <!-- carriage: at C5, trapezoid travel, settle, at G5 -->
  <line x1="130" y1="125" x2="130" y2="65" stroke="#ccc"/>
  <text x="124" y="69" text-anchor="end" fill="#666" font-size="12">G5</text>
  <text x="124" y="129" text-anchor="end" fill="#666" font-size="12">C5</text>
  <polyline points="130,125 330,125 360,121 400,105 520,81 560,68 590,65 870,65" fill="none" stroke="#2563eb" stroke-width="3"/>
  <rect x="590" y="58" width="40" height="14" fill="#dbeafe"/>
  <text x="610" y="54" text-anchor="middle" fill="#2563eb" font-size="11">settle</text>
  <text x="230" y="117" text-anchor="middle" fill="#2563eb" font-size="12">waits at C5 while it rings</text>
  <text x="460" y="128" text-anchor="middle" fill="#2563eb" font-size="12">travel (trapezoid)</text>

  <!-- solenoid: previous pulse, fire pulse -->
  <line x1="130" y1="195" x2="870" y2="195" stroke="#ccc"/>
  <rect x="150" y="165" width="22" height="30" fill="#f59e0b"/>
  <text x="161" y="160" text-anchor="middle" fill="#92400e" font-size="11">last strike</text>
  <rect x="640" y="165" width="22" height="30" fill="#f59e0b"/>
  <text x="651" y="160" text-anchor="middle" fill="#92400e" font-size="11">pulse</text>

  <!-- sound: ring of previous, new strike at beat -->
  <line x1="130" y1="265" x2="870" y2="265" stroke="#ccc"/>
  <path d="M 162 265 Q 170 235 178 265 T 194 265 T 210 265" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 210 265 C 300 252, 450 262, 640 265" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M 676 265 Q 684 232 692 265 T 708 265 T 724 265" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M 724 265 C 780 255, 830 262, 870 265" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="400" y="248" text-anchor="middle" fill="#16a34a" font-size="12">C5 rings on</text>

  <!-- the beat -->
  <line x1="676" y1="40" x2="676" y2="300" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="684" y="52" fill="#dc2626" font-weight="bold">the beat</text>

  <!-- time markers -->
  <line x1="330" y1="300" x2="330" y2="330" stroke="#444"/>
  <text x="330" y="346" text-anchor="middle" fill="#222" font-size="12">move_start_s</text>
  <line x1="640" y1="300" x2="640" y2="330" stroke="#444"/>
  <text x="626" y="346" text-anchor="end" fill="#222" font-size="12">fire_s</text>
  <line x1="340" y1="322" x2="630" y2="322" stroke="#444" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="485" y="315" text-anchor="middle" fill="#222" font-size="12">move_s = travel + settle (755 ms for C5 → G5)</text>
  <line x1="644" y1="292" x2="672" y2="292" stroke="#444" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="700" y="346" fill="#222" font-size="12">latency 12 ms</text>
  <line x1="700" y1="335" x2="660" y2="296" stroke="#999"/>

  <text x="450" y="372" text-anchor="middle" fill="#666" font-size="12">fire_s = sound time − latency · move_start_s = fire_s − move_s · the next move may start once the pulse ends</text>
</svg>
