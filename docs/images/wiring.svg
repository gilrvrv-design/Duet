<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Rig wiring: ESP32, stepper driver, solenoid, home sensor, emergency stop, LED strip and power</title>
  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Rig wiring (pins from firmware/src/board.h)</text>

  <!-- power rails legend -->
  <g font-size="12">
    <line x1="40" y1="52" x2="70" y2="52" stroke="#dc2626" stroke-width="3"/><text x="76" y="56" fill="#222">12 V</text>
    <line x1="130" y1="52" x2="160" y2="52" stroke="#ea580c" stroke-width="3"/><text x="166" y="56" fill="#222">5 V</text>
    <line x1="210" y1="52" x2="240" y2="52" stroke="#ca8a04" stroke-width="3"/><text x="246" y="56" fill="#222">3.3 V</text>
    <line x1="305" y1="52" x2="335" y2="52" stroke="#111" stroke-width="3"/><text x="341" y="56" fill="#222">GND (all grounds joined)</text>
    <line x1="530" y1="52" x2="560" y2="52" stroke="#2563eb" stroke-width="2"/><text x="566" y="56" fill="#222">signal</text>
  </g>

  <!-- ESP32 -->
  <rect x="380" y="190" width="220" height="330" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="490" y="215" text-anchor="middle" font-weight="bold" fill="#0c4a6e">ESP32 DevKit</text>
  <g font-size="12" fill="#0c4a6e">
    <text x="392" y="250">GPIO 25  STEP</text>
    <text x="392" y="275">GPIO 26  DIR</text>
    <text x="392" y="300">GPIO 27  EN</text>
    <text x="392" y="345">GPIO 32  SOLENOID</text>
    <text x="588" y="395" text-anchor="end">HOME  GPIO 34</text>
    <text x="588" y="440" text-anchor="end">ESTOP  GPIO 35</text>
    <text x="588" y="485" text-anchor="end">LEDS  GPIO 13</text>
    <text x="392" y="505">5V   3V3   GND   USB</text>
  </g>

  <!-- Stepper driver -->
  <rect x="80" y="210" width="190" height="110" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="175" y="232" text-anchor="middle" font-weight="bold">Stepper driver</text>
  <text x="175" y="250" text-anchor="middle" font-size="11" fill="#555">TMC2209 or A4988 · 1/16 steps</text>
  <text x="92" y="272" font-size="11">STEP  DIR  EN</text>
  <text x="92" y="296" font-size="11">VM 12 V · current limit set</text>
  <text x="92" y="312" font-size="11">A1 A2 B1 B2 → motor</text>
  <line x1="380" y1="246" x2="270" y2="246" stroke="#2563eb" stroke-width="2"/>
  <line x1="380" y1="271" x2="270" y2="271" stroke="#2563eb" stroke-width="2"/>
  <line x1="380" y1="296" x2="300" y2="296" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="296" x2="300" y2="280" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="280" x2="270" y2="280" stroke="#2563eb" stroke-width="2"/>

  <!-- NEMA 17 -->
  <rect x="100" y="90" width="80" height="80" rx="4" fill="#374151"/>
  <circle cx="140" cy="130" r="14" fill="#9ca3af"/>
  <text x="140" y="80" text-anchor="middle" font-weight="bold">NEMA 17 stepper</text>
  <line x1="140" y1="170" x2="140" y2="210" stroke="#7c3aed" stroke-width="3"/>
  <text x="150" y="194" font-size="11" fill="#6d28d9">4 wires (2 coils)</text>

  <!-- Solenoid driver -->
  <rect x="80" y="360" width="190" height="150" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="175" y="382" text-anchor="middle" font-weight="bold">Solenoid switch</text>
  <text x="92" y="404" font-size="11">Logic-level N-MOSFET</text>
  <text x="92" y="420" font-size="11">(e.g. IRLZ44N)</text>
  <text x="92" y="440" font-size="11">gate: 100 Ω from GPIO 32</text>
  <text x="92" y="456" font-size="11">10 kΩ gate → GND (off at boot)</text>
  <text x="92" y="476" font-size="11" font-weight="bold" fill="#b91c1c">flyback diode across coil</text>
  <text x="92" y="492" font-size="11">(1N5819, stripe to +12 V)</text>
  <line x1="380" y1="341" x2="320" y2="341" stroke="#2563eb" stroke-width="2"/>
  <line x1="320" y1="341" x2="320" y2="436" stroke="#2563eb" stroke-width="2"/>
  <line x1="320" y1="436" x2="270" y2="436" stroke="#2563eb" stroke-width="2"/>

  <!-- solenoid itself -->
  <rect x="100" y="560" width="150" height="60" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="175" y="585" text-anchor="middle" font-weight="bold" fill="#92400e">JF-1039B solenoid</text>
  <text x="175" y="603" text-anchor="middle" font-size="10" fill="#92400e">12 V push-pull, on the carriage</text>
  <line x1="150" y1="510" x2="150" y2="560" stroke="#dc2626" stroke-width="3"/>
  <text x="104" y="540" font-size="11" fill="#b91c1c">+12 V</text>
  <line x1="200" y1="510" x2="200" y2="560" stroke="#111" stroke-width="3"/>
  <text x="206" y="540" font-size="11">drain</text>

  <!-- Home sensor -->
  <rect x="740" y="360" width="250" height="80" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="865" y="382" text-anchor="middle" font-weight="bold" fill="#065f46">Home sensor LJ12A3 (NPN, NO)</text>
  <text x="752" y="402" font-size="11">brown +12 V · blue GND · black signal</text>
  <text x="752" y="420" font-size="11">signal: 10 kΩ pull-up to 3.3 V (not 12 V)</text>
  <text x="752" y="434" font-size="11">active low: HOME_ACTIVE_LOW = true</text>
  <line x1="600" y1="391" x2="740" y2="391" stroke="#2563eb" stroke-width="2"/>

  <!-- E-stop -->
  <rect x="740" y="455" width="250" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="865" y="476" text-anchor="middle" font-weight="bold" fill="#991b1b">Emergency stop button</text>
  <text x="752" y="496" font-size="11">button to GND · <tspan font-weight="bold">external</tspan> 10 kΩ pull-up to 3.3 V</text>
  <text x="752" y="510" font-size="11">GPIO 34–39 have no internal pull-ups</text>
  <line x1="600" y1="436" x2="680" y2="436" stroke="#2563eb" stroke-width="2"/>
  <line x1="680" y1="436" x2="680" y2="485" stroke="#2563eb" stroke-width="2"/>
  <line x1="680" y1="485" x2="740" y2="485" stroke="#2563eb" stroke-width="2"/>

  <!-- Level shifter and LEDs -->
  <rect x="650" y="560" width="150" height="70" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
  <text x="725" y="584" text-anchor="middle" font-weight="bold" fill="#5b21b6">Level shifter</text>
  <text x="725" y="602" text-anchor="middle" font-size="11">74AHCT125, 3.3 V → 5 V</text>
  <text x="725" y="618" text-anchor="middle" font-size="11">then 330 Ω to DIN</text>
  <line x1="600" y1="481" x2="625" y2="481" stroke="#2563eb" stroke-width="2"/>
  <line x1="625" y1="481" x2="625" y2="595" stroke="#2563eb" stroke-width="2"/>
  <line x1="625" y1="595" x2="650" y2="595" stroke="#2563eb" stroke-width="2"/>
  <rect x="850" y="565" width="200" height="60" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="950" y="588" text-anchor="middle" font-weight="bold" fill="#713f12">LED strip, 176 LEDs</text>
  <text x="950" y="606" text-anchor="middle" font-size="11">WS2812B, 144/m, 1.22 m</text>
  <text x="950" y="619" text-anchor="middle" font-size="11">1000 µF across 5 V at the strip</text>
  <line x1="800" y1="595" x2="850" y2="595" stroke="#2563eb" stroke-width="2"/>
  <g fill="#facc15" stroke="#a16207" stroke-width="0.5">
    <rect x="862" y="632" width="10" height="8"/><rect x="876" y="632" width="10" height="8"/><rect x="890" y="632" width="10" height="8"/><rect x="904" y="632" width="10" height="8"/><rect x="918" y="632" width="10" height="8"/><rect x="932" y="632" width="10" height="8"/><rect x="946" y="632" width="10" height="8"/><rect x="960" y="632" width="10" height="8"/><rect x="974" y="632" width="10" height="8"/><rect x="988" y="632" width="10" height="8"/><rect x="1002" y="632" width="10" height="8"/><rect x="1016" y="632" width="10" height="8"/><rect x="1030" y="632" width="10" height="8"/>
  </g>

  <!-- Power supplies -->
  <rect x="740" y="90" width="300" height="75" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="890" y="113" text-anchor="middle" font-weight="bold" fill="#991b1b">12 V supply, 3 A or more</text>
  <text x="752" y="134" font-size="11">stepper driver VM · solenoid · home sensor</text>
  <text x="752" y="152" font-size="11">inline fuse; emergency stop can also cut this rail</text>
  <rect x="740" y="190" width="300" height="75" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="890" y="213" text-anchor="middle" font-weight="bold" fill="#9a3412">5 V supply, 4 A or more</text>
  <text x="752" y="234" font-size="11">LED strip (inject at both ends) · level shifter</text>
  <text x="752" y="252" font-size="11">ESP32 5V pin (or power it by USB)</text>
  <line x1="740" y1="127" x2="300" y2="127" stroke="#dc2626" stroke-width="3"/>
  <line x1="300" y1="127" x2="300" y2="210" stroke="#dc2626" stroke-width="3"/>
  <line x1="740" y1="228" x2="650" y2="228" stroke="#ea580c" stroke-width="3"/>
  <line x1="650" y1="228" x2="650" y2="170" stroke="#ea580c" stroke-width="3"/>
  <line x1="650" y1="170" x2="560" y2="170" stroke="#ea580c" stroke-width="3"/>
  <line x1="560" y1="170" x2="560" y2="190" stroke="#ea580c" stroke-width="3"/>
  <text x="566" y="184" font-size="11" fill="#9a3412">5V</text>

  <text x="550" y="680" text-anchor="middle" fill="#444" font-size="12">Join all grounds (12 V, 5 V, ESP32, driver, MOSFET source, sensor, LED strip). Part numbers are suggestions; equivalents work.</text>
  <text x="550" y="700" text-anchor="middle" fill="#444" font-size="12">Power the LED strip from the 5 V supply, never from the ESP32's 5V pin.</text>
</svg>
