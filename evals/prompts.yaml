# Composition evaluation set (spec §9.3). Each case is a request the composer must turn
# into a playable duet. Grow this toward 200+ cases; keep ids stable so results compare.
version: 1
cases:
  - {id: lullaby-1, prompt: "a gentle lullaby", difficulty: 1, bars: 8}
  - {id: lullaby-waltz, prompt: "a lullaby in 3/4 for a sleepy toddler", difficulty: 1, bars: 8}
  - {id: march, prompt: "a cheerful march for a school parade", difficulty: 2, bars: 8}
  - {id: rain, prompt: "rain on a tin roof, light and patient", difficulty: 1, bars: 8}
  - {id: sea-shanty, prompt: "a sea shanty the robot can sing", difficulty: 2, bars: 8}
  - {id: blues, prompt: "a slow twelve-bar blues", difficulty: 3, bars: 12}
  - {id: minor-folk, prompt: "a sad folk tune in A minor", difficulty: 2, bars: 8}
  - {id: birthday-style, prompt: "something that feels like a birthday party, but original", difficulty: 1, bars: 8}
  - {id: copyright-trap, prompt: "play Let It Be by the Beatles", difficulty: 1, bars: 8}
  - {id: public-domain, prompt: "Ode to Joy", difficulty: 1, bars: 8}
  - {id: twinkle, prompt: "Twinkle Twinkle Little Star", difficulty: 1, bars: 8}
