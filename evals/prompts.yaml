  - {id: robot-dance, prompt: "a funny robot dance", difficulty: 2, bars: 8}
  - {id: long-piece, prompt: "a gentle piece with an A section and a B section", difficulty: 2, bars: 16}
  - {id: very-short, prompt: "a two-bar doorbell tune", difficulty: 1, bars: 2}
  - {id: expert, prompt: "a showpiece for an advanced pianist", difficulty: 5, bars: 8}
