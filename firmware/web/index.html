<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duet</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div>
      <h1>Duet</h1>
      <p id="device" class="muted">Connecting…</p>
    </div>
    <span id="state" class="pill">…</span>
  </header>

  <main>
    <button id="estop" class="estop" type="button">Emergency stop</button>
    <p id="message" class="message" role="status" hidden></p>

    <section>
      <div class="section-head">
        <h2>Songs on the rig</h2>
        <button id="stop" type="button" hidden>Stop</button>
      </div>
      <ul id="songs" class="songs"></ul>
      <p id="no-songs" class="muted" hidden>
        No songs are stored yet. Upload one from the Hub:
        <code>duet upload song.json --device ws://duet-rig-1.local:8765 --slot 0</code>
      </p>
    </section>

    <section>
      <h2>This board</h2>
      <ul id="abilities" class="abilities"></ul>
    </section>

    <section id="settings">
      <h2 id="settings-title">Settings</h2>
      <p id="setup-intro" class="muted" hidden>
        The rig is not on your Wi-Fi yet. Choose the network it should join.
      </p>
      <form id="settings-form">
        <label>Wi-Fi network
          <input id="wifi-ssid" name="wifi_ssid" required maxlength="32" autocomplete="off">
        </label>
        <label>Wi-Fi password
          <input id="wifi-password" name="wifi_password" type="password" maxlength="63"
                 autocomplete="new-password">
          <span id="password-hint" class="hint">Leave empty for an open network.</span>
        </label>
        <label>Servers
          <textarea id="servers" name="servers" rows="2" spellcheck="false"
                    placeholder="https://duet.example.com"></textarea>
          <span class="hint">One address per line, up to 4. They add composing, lessons and
            more when they can be reached.</span>
        </label>
        <button type="submit">Save</button>
      </form>
    </section>
  </main>
</body>
</html>
