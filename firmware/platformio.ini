; ESP32 firmware for the Duet rig (robot carriage, striker and LED guide on one board).
; Build and flash:  pio run -t upload    Native core tests:  make test
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -O2
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main_qemu.cpp>
lib_deps =
    gin66/FastAccelStepper@^0.31.0
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.4.1

; The same firmware for the Wokwi simulator: Wokwi's Wi-Fi and a virtual home sensor.
; Build with  pio run -e wokwi  and start the simulation from VS Code (see WOKWI.md).
[env:wokwi]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DDUET_WOKWI

; The real core in Espressif's QEMU ESP32 emulator, linked over the serial port, with
; simulated hardware. Lets the Hub's tests run the firmware without a board:
; make qemu-test from the repository root (see QEMU.md).
[env:qemu]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -std=gnu++17 -O2
build_unflags = -std=gnu++11
build_src_filter = +<main_qemu.cpp>
