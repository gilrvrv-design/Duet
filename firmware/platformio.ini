; ESP32 firmware for the Duet rig (robot carriage, striker and LED guide on one board).
; Build and flash:  pio run -t upload    Native core tests:  make test
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -O2
build_unflags = -std=gnu++11
lib_deps =
    gin66/FastAccelStepper@^0.31.0
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.4.1
