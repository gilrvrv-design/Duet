; ESP32 firmware for the Duet rig. One environment per board; each takes its pins and
; features from boards/<name>/board.h (see docs/design/esp-first.md).
; Build one:  pio run -e esp32-classic      Build all:  pio run
; Native core tests (no board needed):  make test

[common]
platform = espressif32 @ 8.0.0  ; pinned: a platform update changes the toolchain and the core
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -O2 -Isrc
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main_qemu.cpp>
extra_scripts =
    pre:tools/pio_embed_web.py  ; the web app, compiled in (tools/embed_web.py)
lib_deps =
    gin66/FastAccelStepper@^0.31.0
    adafruit/Adafruit NeoPixel@^1.12.0
    links2004/WebSockets@^2.4.1

; ESP32 DevKitC (4 MB): the rig as wired in docs/rig-guide.md. huge_app: a 3 MB program
; (the web app is compiled in) and 896 KB for stored songs; no over-the-air updates.
[env:esp32-classic]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${common.build_flags} -Iboards/esp32-classic

; ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB octal PSRAM.
[env:esp32-s3]
extends = common
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = ${common.build_flags} -Iboards/esp32-s3 -DBOARD_HAS_PSRAM

; The same boards with the optional planner module: MIDI files planned on the rig, with
; no server (docs/design/esp-first.md). It costs flash and, while planning, about 150 KB
; of RAM. Build one instead of its plain board:  pio run -e esp32-classic-planner
[env:esp32-classic-planner]
extends = env:esp32-classic
build_flags = ${env:esp32-classic.build_flags} -DDUET_PLANNER

[env:esp32-s3-planner]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -DDUET_PLANNER

; The esp32-classic firmware in the Wokwi simulator: Wokwi's Wi-Fi and a virtual home
; sensor. Build with  pio run -e wokwi  and start it from VS Code (see WOKWI.md).
[env:wokwi]
extends = env:esp32-classic
build_flags = ${env:esp32-classic.build_flags} -DDUET_WOKWI

; The core in Espressif's QEMU ESP32 emulator, linked over the serial port, with stubbed
; hardware: make qemu-test from the repository root (see QEMU.md).
[env:qemu]
extends = common
board = esp32dev
build_flags = ${common.build_flags} -Iboards/qemu
build_src_filter = +<main_qemu.cpp>
lib_deps =
