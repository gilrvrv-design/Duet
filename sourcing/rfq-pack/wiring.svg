<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Arial, sans-serif" font-size="14">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold">DK-1 wiring</text>
  <text x="30" y="60" fill="#444">One controller, two strip halves of 88 LEDs each (176 total, 2 per key). Data flows left to right.</text>

  <!-- USB-C power in -->
  <rect x="30" y="200" width="110" height="70" rx="8" fill="#f2f2f2" stroke="#333"/>
  <text x="85" y="228" text-anchor="middle" font-weight="bold">USB-C</text>
  <text x="85" y="248" text-anchor="middle">phone charger</text>
  <text x="85" y="264" text-anchor="middle" font-size="12">5 V, up to 3 A</text>
  <line x1="140" y1="235" x2="200" y2="235" stroke="#333" stroke-width="3"/>

  <!-- controller -->
  <rect x="200" y="150" width="230" height="190" rx="10" fill="#e8eefc" stroke="#305496" stroke-width="2"/>
  <text x="315" y="178" text-anchor="middle" font-weight="bold">Controller: QuinLED Dig2Go</text>
  <text x="315" y="198" text-anchor="middle" font-size="12">ESP32 · ICS-43434 I2S mic · level shifter</text>
  <text x="315" y="218" text-anchor="middle" font-size="12">in end cap DK1-01/02 (plastic, antenna clear of metal)</text>
  <text x="215" y="250" font-size="12">LED out: GPIO16 (5 V level)</text>
  <text x="215" y="268" font-size="12">Mic: SD GPIO19 · WS GPIO4 · SCK GPIO18</text>
  <text x="215" y="286" font-size="12">Firmware brightness cap: read USB-C CC</text>
  <text x="215" y="302" font-size="12">current advert; never exceed it (≤ 2.5 A</text>
  <text x="215" y="318" font-size="12">for LEDs on a 3 A charger)</text>

  <!-- pigtail -->
  <line x1="430" y1="215" x2="520" y2="215" stroke="#d00" stroke-width="3"/>
  <line x1="430" y1="235" x2="520" y2="235" stroke="#090" stroke-width="3"/>
  <line x1="430" y1="255" x2="520" y2="255" stroke="#000" stroke-width="3"/>
  <text x="440" y="205" font-size="12">DK1-30 pigtail 150 mm</text>
  <text x="440" y="285" font-size="11" fill="#d00">5V</text><text x="465" y="285" font-size="11" fill="#090">DATA</text><text x="505" y="285" font-size="11">GND</text>

  <!-- strip A -->
  <rect x="520" y="200" width="270" height="70" fill="#222" stroke="#000"/>
  <g fill="#ffd34d"><circle cx="540" cy="235" r="6"/><circle cx="565" cy="235" r="6"/><circle cx="590" cy="235" r="6"/><circle cx="745" cy="235" r="6"/><circle cx="770" cy="235" r="6"/></g>
  <text x="655" y="240" text-anchor="middle" fill="#fff">· · · 88 LEDs · · ·</text>
  <text x="655" y="190" text-anchor="middle" font-weight="bold">Strip half A (DIN → DOUT)</text>
  <text x="655" y="292" text-anchor="middle" font-size="12">611 mm in rail half A (625 mm profile, DK1-11)</text>

  <!-- joint -->
  <rect x="790" y="205" width="60" height="60" fill="#fff4d6" stroke="#b58900"/>
  <text x="820" y="240" text-anchor="middle" font-size="12">JST-SM</text>
  <text x="820" y="190" text-anchor="middle" font-size="12">DK1-31 joint</text>
  <text x="820" y="292" text-anchor="middle" font-size="12">inside joiner DK1-04</text>

  <!-- strip B -->
  <rect x="850" y="200" width="270" height="70" fill="#222" stroke="#000"/>
  <g fill="#ffd34d"><circle cx="870" cy="235" r="6"/><circle cx="895" cy="235" r="6"/><circle cx="920" cy="235" r="6"/><circle cx="1075" cy="235" r="6"/><circle cx="1100" cy="235" r="6"/></g>
  <text x="985" y="240" text-anchor="middle" fill="#fff">· · · 88 LEDs · · ·</text>
  <text x="985" y="190" text-anchor="middle" font-weight="bold">Strip half B (DIN → end)</text>
  <text x="985" y="292" text-anchor="middle" font-size="12">far end under blank cap DK1-03</text>

  <!-- optional injection -->
  <path d="M 430 320 L 470 320 L 470 380 L 860 380 L 860 270" fill="none" stroke="#d00" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 430 330 L 460 330 L 460 392 L 872 392 L 872 270" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="480" y="412" font-size="12">DK1-32 OPTIONAL power injection (5V + GND, 22 AWG, along profile floor) — add only if the far end shows colour shift in the voltage-drop test</text>

  <text x="30" y="460" font-size="12" fill="#444">Notes: cut the strip only on its printed cut lines; keep DATA direction arrows pointing away from the controller; check polarity before first power-up.</text>
  <text x="30" y="480" font-size="12" fill="#444">Full white = about 6.6 A (datasheet) to 10.8 A (60 mA rule) for 176-180 LEDs, so the firmware brightness cap is mandatory on USB power.</text>
  <text x="30" y="500" font-size="12" fill="#444">VERIFY on sample: Dig2Go LED output header type and pin order; whether the board has an output fuse (if not, add a 3 A PTC inline in DK1-30).</text>
</svg>
