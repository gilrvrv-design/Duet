[project]
name = "duet"
version = "0.1.0"
description = "Back end for Duet: a human and robot musical duet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "mido>=1.3",
  "numpy>=1.26",
  "websockets>=13",
]

[project.optional-dependencies]
llm = ["anthropic>=2.14"]
audio = ["librosa>=0.10", "soundfile>=0.12"]
mic = ["sounddevice>=0.4"]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
duet = "duet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]  # long lines of SVG markup read better whole
