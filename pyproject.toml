[project]
name = "duet"
version = "0.1.0"
description = "Back end for Duet: a human and robot musical duet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "mido>=1.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
llm = ["anthropic>=2.14"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
duet = "duet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
