# Eight tuned glass bottles, one diatonic octave (spec A1), struck by a solenoid on a
# belt-driven carriage. Pitches and positions are placeholders until the calibration
# wizard measures the real rig.
schema: duet-instrument/1
id: bottles-v1
name: Glass bottles
notes:
  - { name: C5, hz: 523.25 }
  - { name: D5, hz: 587.33 }
  - { name: E5, hz: 659.26 }
  - { name: F5, hz: 698.46 }
  - { name: G5, hz: 783.99 }
  - { name: A5, hz: 880.00 }
  - { name: B5, hz: 987.77 }
  - { name: C6, hz: 1046.50 }
sound: { decay_ms: 1800 }
midi_program: 13  # General MIDI xylophone
bot:
  mechanism: carriage_striker
  positions: [1200, 7600, 14000, 20400, 26800, 33200, 39600, 46000]  # carriage steps
  kinematics: { steps_per_mm: 80, v_max_mm_s: 500, a_max_mm_s2: 5000, settle_ms: 15, travel_steps: 48000 }
  striker: { pulse_us: [15000, 30000], recovery_ms: 60, latency_ms: 12, duty_limit: 0.2 }
