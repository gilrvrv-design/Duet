name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make install
      # The web app's browser tests (tests/test_web_app.py).
      - run: .venv/bin/playwright install --with-deps chromium
      - run: . .venv/bin/activate && make check

  # Every board must build, within its flash layout (PlatformIO fails a build that does
  # not fit). A board's features are whatever its board.h compiles in.
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32-classic, esp32-s3, wokwi, qemu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.board }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware -e ${{ matrix.board }}
